name: Build OmniRoute AMD64 workaround image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git ref to build"
        required: true
        type: string
        default: release/v3.8.51
      image_tag:
        description: "Docker Hub image tag"
        required: true
        type: string
        default: 3.8.51-uniqueitems

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke test linux/amd64
    runs-on: ubuntu-24.04
    env:
      IMAGE_NAME: solomild/omniroute
      IMAGE_TAG: ${{ inputs.image_tag }}
      CONTAINER_NAME: omniroute-uniqueitems-smoke
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build AMD64 image without cache
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner-base
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          no-cache: true
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=8192

      - name: Smoke test image
        run: |
          set -euo pipefail
          cleanup() {
            docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name "$CONTAINER_NAME" -p 20129:20128 "$IMAGE_NAME:$IMAGE_TAG"
          for attempt in $(seq 1 36); do
            body=$(curl -fsS -m 5 http://127.0.0.1:20129/api/monitoring/health 2>/dev/null || true)
            if printf '%s' "$body" | grep -q '"status":"healthy"'; then
              echo "Smoke test passed on attempt $attempt"
              exit 0
            fi
            echo "Health check not ready (attempt $attempt/36); retrying in 5s"
            sleep 5
          done
          echo "Smoke test failed"
          docker logs "$CONTAINER_NAME" || true
          exit 1

      - name: Push image to Docker Hub
        run: docker push "$IMAGE_NAME:$IMAGE_TAG"

      - name: Inspect published image
        run: docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_TAG"
